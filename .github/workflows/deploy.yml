name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Jalankan otomatis saat kamu push ke branch main

permissions:
  contents: write # Izin penting agar GitHub bisa menulis ke branch gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install # atau yarn install

      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # Folder hasil build Docusaurus
          branch: gh-pages # Branch tujuan deployment