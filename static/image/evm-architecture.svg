<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="calldata" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="memory" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a3353"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="stack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172d47"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="storage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="evmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#0a0a0a"/>

  <!-- EVM container box -->
  <rect x="120" y="30" width="660" height="460" rx="14" fill="url(#evmBg)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- EVM label top-center -->
  <text x="450" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" letter-spacing="3" opacity="0.7">E V M</text>

  <!-- === CALLDATA LAYER === -->
  <g filter="url(#shadow)">
    <rect x="160" y="60" width="580" height="85" rx="10" fill="url(#calldata)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <!-- Icon: arrow in (read-only) -->
  <g filter="url(#glow)">
    <line x1="192" y1="103" x2="218" y2="103" stroke="#60a5fa" stroke-width="2"/>
    <polygon points="218,97 230,103 218,109" fill="#60a5fa"/>
    <rect x="178" y="91" width="14" height="24" rx="3" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="181" y1="97" x2="189" y2="97" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
    <line x1="181" y1="101" x2="189" y2="101" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
    <line x1="181" y1="105" x2="189" y2="105" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Label -->
  <text x="252" y="96" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#60a5fa">CALLDATA</text>
  <text x="252" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#93c5fd" opacity="0.8">Read-only · Input dari luar kontrak · Biaya paling murah</text>
  <!-- Lock icon -->
  <g opacity="0.5" transform="translate(690, 88)">
    <rect x="0" y="8" width="20" height="16" rx="3" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <path d="M4 8 Q4 0 10 0 Q16 0 16 8" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="10" cy="16" r="2" fill="#60a5fa"/>
  </g>

  <!-- === MEMORY LAYER === -->
  <g filter="url(#shadow)">
    <rect x="160" y="165" width="580" height="85" rx="10" fill="url(#memory)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <!-- Icon: temporary/flash -->
  <g filter="url(#glow)" transform="translate(178, 186)">
    <polygon points="14,0 6,18 12,18 8,34 22,12 16,12 20,0" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="252" y="201" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#93c5fd">MEMORY</text>
  <text x="252" y="220" font-family="'Inter', sans-serif" font-size="12" fill="#93c5fd" opacity="0.8">Sementara · Hanya ada selama eksekusi fungsi · Lebih murah dari storage</text>
  <!-- Temp indicator bars -->
  <g opacity="0.4" filter="url(#glow)">
    <rect x="690" y="190" width="42" height="8" rx="2" fill="#93c5fd"/>
    <rect x="690" y="202" width="30" height="8" rx="2" fill="#93c5fd"/>
    <rect x="690" y="214" width="36" height="8" rx="2" fill="#93c5fd"/>
  </g>

  <!-- === STACK LAYER === -->
  <g filter="url(#shadow)">
    <rect x="160" y="270" width="580" height="85" rx="10" fill="url(#stack)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <!-- Icon: stacked plates -->
  <g filter="url(#glow)" transform="translate(178, 283)">
    <rect x="0" y="36" width="26" height="8" rx="2" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="3" y="25" width="20" height="8" rx="2" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="6" y="14" width="14" height="8" rx="2" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="9" y="4"  width="8"  height="8" rx="2" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
  </g>
  <text x="252" y="306" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#7dd3fc">STACK</text>
  <text x="252" y="325" font-family="'Inter', sans-serif" font-size="12" fill="#93c5fd" opacity="0.8">Area kerja EVM · Operasi aritmetika &amp; logika · Max 1024 items</text>
  <!-- Stack depth indicator -->
  <g opacity="0.35" filter="url(#glow)">
    <rect x="688" y="286" width="44" height="6" rx="1" fill="#7dd3fc"/>
    <rect x="690" y="295" width="40" height="6" rx="1" fill="#7dd3fc"/>
    <rect x="692" y="304" width="36" height="6" rx="1" fill="#7dd3fc"/>
    <rect x="694" y="313" width="32" height="6" rx="1" fill="#7dd3fc"/>
    <rect x="696" y="322" width="28" height="6" rx="1" fill="#7dd3fc"/>
  </g>

  <!-- === STORAGE LAYER === -->
  <g filter="url(#shadow)">
    <rect x="160" y="375" width="580" height="90" rx="10" fill="url(#storage)" stroke="#2563eb" stroke-width="2"/>
  </g>
  <!-- Icon: database cylinder -->
  <g filter="url(#glow)" transform="translate(175, 385)">
    <ellipse cx="15" cy="6"  rx="13" ry="5" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
    <line x1="2" y1="6" x2="2" y2="30" stroke="#3b82f6" stroke-width="1.8"/>
    <line x1="28" y1="6" x2="28" y2="30" stroke="#3b82f6" stroke-width="1.8"/>
    <ellipse cx="15" cy="30" rx="13" ry="5" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
    <ellipse cx="15" cy="18" rx="13" ry="5" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  </g>
  <text x="252" y="412" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#3b82f6">STORAGE</text>
  <text x="252" y="431" font-family="'Inter', sans-serif" font-size="12" fill="#93c5fd" opacity="0.8">Permanen · Tersimpan di blockchain · Biaya gas paling mahal</text>
  <!-- Chain-link icon bottom right -->
  <g opacity="0.5" filter="url(#glow)" transform="translate(676, 392)">
    <circle cx="10" cy="18" r="9" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <rect x="6" y="14" width="8" height="8" rx="2" fill="#0a0a0a"/>
    <circle cx="30" cy="18" r="9" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <rect x="26" y="14" width="8" height="8" rx="2" fill="#0a0a0a"/>
    <line x1="19" y1="18" x2="21" y2="18" stroke="#3b82f6" stroke-width="3"/>
  </g>

  <!-- Vertical connectors between layers -->
  <g stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45">
    <line x1="450" y1="145" x2="450" y2="165"/>
    <line x1="450" y1="250" x2="450" y2="270"/>
    <line x1="450" y1="355" x2="450" y2="375"/>
  </g>
  <g fill="#3b82f6" opacity="0.45">
    <polygon points="445,163 455,163 450,172"/>
    <polygon points="445,268 455,268 450,277"/>
    <polygon points="445,373 455,373 450,382"/>
  </g>

  <!-- Gas cost bar on the right side -->
  <text x="820" y="80"  text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#60a5fa" opacity="0.6" letter-spacing="1">GAS</text>
  <rect x="808" y="88"  width="24" height="12" rx="3" fill="#60a5fa" opacity="0.2" stroke="#60a5fa" stroke-width="1"/>
  <text x="820" y="98"  text-anchor="middle" font-family="monospace" font-size="8" fill="#60a5fa" opacity="0.7">LOW</text>
  <rect x="808" y="193" width="24" height="12" rx="3" fill="#60a5fa" opacity="0.3" stroke="#60a5fa" stroke-width="1"/>
  <text x="820" y="203" text-anchor="middle" font-family="monospace" font-size="8" fill="#60a5fa" opacity="0.7">MED</text>
  <rect x="808" y="298" width="24" height="12" rx="3" fill="#60a5fa" opacity="0.4" stroke="#60a5fa" stroke-width="1"/>
  <text x="820" y="308" text-anchor="middle" font-family="monospace" font-size="8" fill="#60a5fa" opacity="0.7">MED</text>
  <rect x="808" y="410" width="24" height="12" rx="3" fill="#60a5fa" opacity="0.7" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="820" y="420" text-anchor="middle" font-family="monospace" font-size="8" fill="#60a5fa" opacity="0.9">HIGH</text>
</svg>
